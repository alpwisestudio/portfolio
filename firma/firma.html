<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Firma email Alpwise Studio</title>
  </head>
  <!--
    Firma delle email dello studio, uguale per tutti. Apri questo file nel browser, seleziona il riquadro, copia e
    incolla in Gmail › Impostazioni › Firma.
    Tema Chiaro: token di @alpwisestudio/ui come esadecimali (i client email non leggono le variabili CSS), font di
    sistema (Host Grotesk non arriva nelle email), loghi PNG in public/brand/email/ (gli SVG non si vedono).
    Testi da src/content/site.ts, dal footer e dalla pagina /book: se cambiano lì, cambiali anche qui.
  -->
  <body style="margin: 0; padding: 24px; background-color: #ffffff">
    <table
      role="presentation"
      width="480"
      cellpadding="0"
      cellspacing="0"
      style="
        width: 100%;
        max-width: 480px;
        border-collapse: collapse;
        font-family: Helvetica, Arial, sans-serif;
        color: #000000;
      "
    >
      <!-- Marchio e posizionamento -->
      <tr>
        <td colspan="2" style="padding: 0 0 16px">
          <a
            href="https://alpwise.studio"
            style="display: inline-block; text-decoration: none"
            ><img
              src="https://alpwise.studio/brand/email/alpwise-wordmark-black.png"
              width="153"
              height="28"
              alt="Alpwise Studio"
              style="display: block; border: 0; width: 153px; height: 28px"
          /></a>
        </td>
      </tr>
      <tr>
        <td
          colspan="2"
          style="
            padding: 0 0 4px;
            font-size: 16px;
            line-height: 22px;
            color: #000000;
          "
        >
          Consulenza digitale per le PMI, ai piedi delle Prealpi.
        </td>
      </tr>
      <tr>
        <td
          colspan="2"
          style="
            padding: 0 0 16px;
            font-size: 13px;
            line-height: 20px;
            color: #4a525e;
          "
        >
          Siti · Gestionali su misura · AI e automazioni
        </td>
      </tr>
      <!-- Contatti su due colonne: etichetta sopra, dato sotto -->
      <tr>
        <td
          width="50%"
          style="
            border-top: 1px solid #e4e8ee;
            padding: 16px 16px 12px 0;
            vertical-align: top;
          "
        >
          <span
            style="
              display: block;
              font-size: 12px;
              line-height: 16px;
              font-weight: 500;
              color: #6c7582;
            "
            >Telefono</span
          >
          <a
            href="tel:+393773183236"
            style="
              font-size: 14px;
              line-height: 20px;
              color: #000000;
              text-decoration: none;
              font-variant-numeric: tabular-nums;
            "
            >+39 377 318 3236</a
          >
        </td>
        <td
          width="50%"
          style="
            border-top: 1px solid #e4e8ee;
            padding: 16px 0 12px;
            vertical-align: top;
          "
        >
          <span
            style="
              display: block;
              font-size: 12px;
              line-height: 16px;
              font-weight: 500;
              color: #6c7582;
            "
            >Email</span
          >
          <a
            href="mailto:alpwisestudio@gmail.com"
            style="
              font-size: 14px;
              line-height: 20px;
              color: #000000;
              text-decoration: none;
            "
            >alpwisestudio@gmail.com</a
          >
        </td>
      </tr>
      <tr>
        <td width="50%" style="padding: 0 16px 16px 0; vertical-align: top">
          <span
            style="
              display: block;
              font-size: 12px;
              line-height: 16px;
              font-weight: 500;
              color: #6c7582;
            "
            >Sito</span
          >
          <a
            href="https://alpwise.studio"
            style="
              font-size: 14px;
              line-height: 20px;
              color: #0b5ed7;
              text-decoration: underline;
            "
            >alpwise.studio</a
          >
        </td>
        <td width="50%" style="padding: 0 0 16px; vertical-align: top">
          <span
            style="
              display: block;
              font-size: 12px;
              line-height: 16px;
              font-weight: 500;
              color: #6c7582;
            "
            >Sede</span
          >
          <span style="font-size: 14px; line-height: 20px; color: #000000"
            >Gallarate (VA)</span
          >
        </td>
      </tr>
      <!-- Alpwise book -->
      <tr>
        <td
          colspan="2"
          style="border-top: 1px solid #e4e8ee; padding: 16px 0 0"
        >
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="border-collapse: collapse"
          >
            <tr>
              <td style="vertical-align: middle">
                <a
                  href="https://alpwise.studio/book"
                  style="display: inline-block; text-decoration: none"
                  ><img
                    src="https://alpwise.studio/brand/email/alpwise-book-black.png"
                    width="122"
                    height="22"
                    alt="Alpwise book"
                    style="
                      display: block;
                      border: 0;
                      width: 122px;
                      height: 22px;
                    "
                /></a>
                <span
                  style="
                    display: block;
                    margin-top: 6px;
                    font-size: 13px;
                    line-height: 18px;
                    color: #4a525e;
                  "
                  >Prenotazioni per ristoranti, dal tuo sito.</span
                >
              </td>
              <td
                align="right"
                style="
                  vertical-align: middle;
                  padding-left: 16px;
                  white-space: nowrap;
                "
              >
                <a
                  href="https://alpwise.studio/book"
                  style="
                    font-size: 13px;
                    line-height: 18px;
                    font-weight: 500;
                    color: #0b5ed7;
                    text-decoration: underline;
                  "
                  >Scopri</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td
          colspan="2"
          style="
            padding: 16px 0 0;
            font-size: 12px;
            line-height: 18px;
            color: #6c7582;
          "
        >
          Rispondiamo entro un giorno lavorativo.
        </td>
      </tr>
    </table>
  </body>
</html>
