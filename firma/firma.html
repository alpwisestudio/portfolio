<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Firma email Alpwise Studio</title>
  </head>
  <!--
    Firma delle email dello studio. Apri questo file nel browser, seleziona tutto il riquadro, copia e incolla in
    Gmail › Impostazioni › Firma. Cambia il nome per ogni persona dello studio.
    Colori dai token di @alpwisestudio/ui (Chiaro) come esadecimali: i client email non leggono le variabili CSS.
    Font di sistema: Host Grotesk non arriva nelle email. Il simbolo è un PNG (gli SVG non si vedono):
    https://alpwise.studio/brand/email/alpwise-symbol.png, A bianca su Notte (#06080B).
  -->
  <body style="margin: 0; padding: 24px; background-color: #ffffff">
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      style="
        border-collapse: collapse;
        font-family: Helvetica, Arial, sans-serif;
        color: #000000;
      "
    >
      <tr>
        <td style="padding: 0 16px 0 0; vertical-align: top">
          <a
            href="https://alpwise.studio"
            style="display: block; text-decoration: none"
            ><img
              src="https://alpwise.studio/brand/email/alpwise-symbol.png"
              width="56"
              height="56"
              alt="Alpwise Studio"
              style="display: block; border: 0; width: 56px; height: 56px"
          /></a>
        </td>
        <td
          style="
            padding: 0 0 0 16px;
            vertical-align: top;
            border-left: 1px solid #e4e8ee;
          "
        >
          <p
            style="
              margin: 0;
              font-size: 16px;
              line-height: 22px;
              font-weight: 400;
              color: #000000;
            "
          >
            Luca Mimmo
          </p>
          <p
            style="
              margin: 0 0 12px;
              font-size: 13px;
              line-height: 20px;
              font-weight: 500;
              color: #6c7582;
            "
          >
            Alpwise Studio · Gallarate (VA)
          </p>
          <p
            style="
              margin: 0;
              font-size: 13px;
              line-height: 20px;
              color: #4a525e;
              font-variant-numeric: tabular-nums;
            "
          >
            <a
              href="tel:+393773183236"
              style="color: #4a525e; text-decoration: none"
              >+39 377 318 3236</a
            >
            <span style="color: #c9d0d9">&nbsp;·&nbsp;</span>
            <a
              href="mailto:alpwisestudio@gmail.com"
              style="color: #4a525e; text-decoration: none"
              >alpwisestudio@gmail.com</a
            >
          </p>
          <p style="margin: 0; font-size: 13px; line-height: 20px">
            <a
              href="https://alpwise.studio"
              style="color: #0b5ed7; text-decoration: underline"
              >alpwise.studio</a
            >
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
